name: Release APK

# Only the `production` branch ever produces a release. Every other branch is
# covered by ci.yml (build + test only, no APK, no release).
on:
  push:
    branches: [production]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate release signing key
        # Self-signed, generated fresh each run: good enough to let anyone
        # install the APK directly, not meant to prove developer identity.
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias watchvault \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass watchvault -keypass watchvault \
            -dname "CN=WatchVault, OU=WatchVault, O=WatchVault, L=NA, S=NA, C=IN"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: watchvault
          RELEASE_KEY_ALIAS: watchvault
          RELEASE_KEY_PASSWORD: watchvault
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        # Two copies of the same file: a versioned one for the release's own asset list, and a
        # constantly-named one so the README's "latest download" link/badge never has to change.
        # Every release carries a WatchVault-latest.apk, so /releases/latest/download/... always
        # resolves to whichever release GitHub currently marks "Latest".
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/WatchVault-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "out/WatchVault-latest.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: WatchVault ${{ steps.version.outputs.name }}
          files: |
            out/WatchVault-${{ steps.version.outputs.name }}.apk
            out/WatchVault-latest.apk
          generate_release_notes: true
